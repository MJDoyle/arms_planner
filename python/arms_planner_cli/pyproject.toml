[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arms_planner_cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "arms_planner_core>=0.1.0",
]

[project.scripts]
arms = "arms_planner_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arms_planner_cli*"]
